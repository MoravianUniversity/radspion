server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.radspion.com;

    ssl_certificate     /etc/letsencrypt/live/dev.radspion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.radspion.com/privkey.pem;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://unix:/run/radspiondev/gunicorn.sock:/;
    }
}
